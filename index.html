<script>
const STATUSES=['Imported','Validated','Published to CVC','Draft Request','Submitted by CVC','Supervisor Review','Budget and Finance Review','Approved for Purchasing','Purchasing in Progress','Purchased','Distribution and Receipt Confirmation','Reconciliation','Closed'];
const STKH={'Imported':'បាននាំចូល','Validated':'បានផ្ទៀងផ្ទាត់','Published to CVC':'បានផ្សាយទៅ CVC','Draft Request':'សំណើព្រាង','Submitted by CVC':'CVC បានដាក់ស្នើ','Supervisor Review':'ត្រួតពិនិត្យដោយអ្នកគ្រប់គ្រង','Budget and Finance Review':'ត្រួតពិនិត្យថវិកា និងហិរញ្ញវត្ថុ','Approved for Purchasing':'អនុម័តឱ្យទិញ','Purchasing in Progress':'កំពុងទិញ','Purchased':'បានទិញរួច','Distribution and Receipt Confirmation':'ចែកចាយ និងបញ្ជាក់ការទទួល','Reconciliation':'ផ្ទៀងផ្ទាត់ចុងក្រោយ','Closed':'បិទបញ្ជី','Rejected':'បដិសេធ'};
const ROLES={admin:['System Administrator','អ្នកគ្រប់គ្រងប្រព័ន្ធ'],gnc:['GN Coordinator','អ្នកសម្របសម្រួល GN'],cvc:['CVC User','អ្នកសម្របសម្រួលស្ម័គ្រចិត្តសហគមន៍ (CVC)'],sup:['ADP / Programme Supervisor','អ្នកគ្រប់គ្រងកម្មវិធី'],fin:['Finance Reviewer','អ្នកត្រួតពិនិត្យហិរញ្ញវត្ថុ'],pur:['Purchasing Officer','មន្ត្រីទិញ'],fap:['Final Approver','អ្នកអនុម័តចុងក្រោយ'],aud:['Auditor / Read-only','សវនករ / មើលតែប៉ុណ្ណោះ']};

const t=(en,km)=>S.ui.lang==='en'?en:S.ui.lang==='km'?km:km+' / '+en;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd2=n=>n==null||isNaN(n)?'—':'$'+Number(n).toFixed(2);
const usd=n=>n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const khr=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:0})+' ៛';
const catName=id=>(S.cats.find(c=>c.id===id)||{name:id}).name;
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function daysLeft(iso){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);return Math.round((new Date(y,m-1,d)-today())/864e5)}
const norm=x=>String(x==null?'':x).replace(/\s+/g,' ').trim().toLowerCase();
const hasKh=s=>/[\u1780-\u17FF]/.test(String(s==null?'':s));
const stTag=s=>`<span class="tag ${s==='Rejected'?'err':s==='Approved for Purchasing'?'ok':''}">${esc(S.ui.lang==='en'?s:S.ui.lang==='km'?STKH[s]:STKH[s]+' / '+s)}</span>`;
function FYOF(iso){const m=/^(\d{4})-(\d{2})/.exec(iso||'');return m?'FY'+String((+m[1]+(+m[2]>=10?1:0))%100).padStart(2,'0'):''}
function gnOf(rc){return Object.values(S.gn).filter(g=>g.rc===rc).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||a.key.localeCompare(b.key))}
function gnLimit(g){return (g.child!=null?g.child:(g.total||0))*(g.rate||S.rate)}
function manualCant(g){return (g.cantParts||[]).reduce((s,x)=>s+(+x.khr||0),0)}
function subLines(rc){const o=[];(S.hist[rc]||[]).forEach(r=>r.lines.forEach(l=>o.push(l)));return o}
function gnProgress(rc){return subLines(rc).length>0||gnOf(rc).some(g=>(g.cantParts||[]).length)}
const GST={done:['Done','បានទិញរួចរាល់','ok'],pending_staff:['Pending staff processing','រង់ចាំបុគ្គលិកដំណើរការ',''],pending_cvc:['Pending CVC proposal','រង់ចាំ CVC រៀបចំសំណើ','warn'],cant:["Can't process",'មិនអាចដំណើរការបាន','err'],partial:['Partly processed','ដំណើរការមួយផ្នែក','warn'],prior:['Done before this app','ដំណើរការរួចមុនប្រព័ន្ធនេះ','ok'],gone:['Closed in Horizon','បិទក្នុង Horizon',''],released:['Released to CVC','ត្រឡប់ទៅ CVC វិញ','warn']};
function gstTag(k){const x=GST[k]||GST.partial;return `<span class="tag ${x[2]}">${esc(t(x[0],x[1]))}</span>`}
function gnState(p){const v=[['done',p.done],['pending_staff',p.staff],['pending_cvc',p.cvc],['cant',p.cant]].filter(x=>x[1]>0.5);return v.length===1?v[0][0]:v.length?'partial':'pending_cvc'}
/* Splits every item amount over the child's GN entries, oldest GN first. noCur=true ignores the request being prepared now. */
function gnParts(rc,noCur){const c=S.children[rc];const P=gnOf(rc).filter(g=>!g.prior&&!g.gone).map(g=>({g,limit:gnLimit(g),done:0,staff:0,cvc:0,cant:Math.min(gnLimit(g),manualCant(g))}));let over=0;
 const feed=(l,k)=>{let a=lineTotal(l);for(const p of P){if(a<=0.0001)break;const cap=p.limit-p.done-p.staff-p.cant;if(cap<=0.0001)continue;const x=Math.min(cap,a);p[k]+=x;a-=x}over+=Math.max(0,a)};
 subLines(rc).forEach(l=>{if(l.ps==='released')return;feed(l,l.ps==='done'?'done':l.ps==='cant'?'cant':'staff')});
 if(!noCur&&c&&STATUSES.indexOf(c.status)>=STATUSES.indexOf('Submitted by CVC'))getReq(rc).lines.forEach(l=>feed(l,'staff'));
 P.forEach(p=>{p.cvc=Math.max(0,p.limit-p.done-p.staff-p.cant);p.state=gnState(p)});return{P,over}}
function poolKHR(rc){return gnParts(rc,true).P.reduce((s,p)=>s+p.cvc,0)}   /* budget still free for a NEW request: old / processed GN budget is already used up */
const pBudget=c=>poolKHR(c.rcId)/(c.rate||S.rate);
const itemKey=l=>String(l.cat||'')+'|'+norm(l.name).replace(/\s+/g,'');
function prevItem(rc,l){if(!l.name)return null;const k=itemKey(l),sc=S.ui.dupScope||'fy',fy=FYOF(new Date().toISOString().slice(0,10));
 for(const r of (S.hist[rc]||[])){if(sc==='fy'&&FYOF(r.memoAt)!==fy)continue;for(const x of r.lines){if(x.ps==='released'||x.ps==='cant')continue;if(itemKey(x)===k)return{memoId:r.memoId,at:r.memoAt,ps:x.ps}}}return null}
function refreshChild(rc){const c=S.children[rc];if(!c)return;const all=gnOf(rc).filter(g=>!g.prior&&!g.gone);if(!all.length)return;const {P}=gnParts(rc,true);
 const act=P.filter(p=>p.state!=='done'&&p.state!=='cant'&&p.limit>0.5).map(p=>p.g);const use=act.length?act:all;
 const sm=f=>use.some(g=>g[f]!=null)?use.reduce((s,g)=>s+(Number(g[f])||0),0):null;
 c.total=sm('total');c.community=sm('community');c.child=sm('child');c.gnCount=act.length;
 const dues=act.map(g=>g.due).filter(Boolean).sort();c.due=dues[0]||c.due||null;
 const ds=gnOf(rc).map(g=>g.date).filter(Boolean).sort();c.gnLast=ds[ds.length-1]||c.gnLast||'';
 if(act.length)c.rate=act[act.length-1].rate||c.rate;
 const fy=FYOF(c.gnLast);c.gnFY=fy;c.gnYear=gnOf(rc).filter(g=>!g.legacy&&FYOF(g.date)===fy).length}
function syncStatus(rc){const c=S.children[rc];if(!c||!['Purchasing in Progress','Purchased'].includes(c.status))return;const pool=poolKHR(rc),pend=subLines(rc).some(l=>l.ps==='staff');
 c.status=pool>0.5?'Published to CVC':pend?'Purchasing in Progress':'Purchased'}
function ledger(rc){const c=S.children[rc],r=getReq(rc);const rate=c.rate||S.rate;const limit=poolKHR(rc);const req=r.lines.reduce((s,l)=>s+lineTotal(l),0);
 const warns=[];const seen={};r.lines.forEach((l,i)=>{if(!(Number(l.qty)>0))warns.push(`Line ${i+1}: quantity is zero`);if(!(Number(l.price)>0))warns.push(`Line ${i+1}: missing price`);if(!l.name)warns.push(`Line ${i+1}: no item name`);const k=l.cat+'|'+norm(l.name);if(l.name&&seen[k])warns.push(`Line ${i+1}: duplicate selection "${l.name}"`);seen[k]=1});
 const dups=[];r.lines.forEach((l,i)=>{const p=prevItem(rc,l);if(p){const ok=!!l.dupOk;dups.push({i,ok,name:l.name,...p});if(!ok)warns.push(`Line ${i+1}: "${l.name}" is already in memo ${p.memoId} (${p.at}) – the same item cannot go into a new memo`)}});
 if(c.community!=null&&c.child!=null&&c.total!=null&&Math.abs(c.community+c.child-c.total)>.005)warns.push('Imported community + child allocation does not equal total budget');
 return{rate,limit,req,rem:limit-req,over:req>limit+0.5,warns,dups,limitCommunity:(c.community||0)*rate,limitChild:limit}}

function getReq(rc){if(!S.req[rc])S.req[rc]={lines:[],ref:null,version:0,exc:null,versions:[]};return S.req[rc]}
const lineTotal=l=>(Number(l.qty)||0)*(Number(l.price)||0);

const IMP={};
const DASH={gn:null,corr:null,url:'https://djonskiwivhsmgwjkhku.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqb25za2l3aXZoc21nd2praGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Nzc5NTYsImV4cCI6MjEwNDE1Mzk1Nn0.h67QIr0HxchgLc0tVvfpwvdJCk_cLECCtkqt6u37IyU',sb:null,rc:null,idx:null,cvcMap:null,n:0,at:'',err:''};
const DKEY={users:'sd:users:v1',rc:'sd:rc:v1',cvcmap:'sd:cvcmap:v1'};
const VILLAGE_NAME_KH_MAP = {

  'trang': 'ត្រាង',

 r.version++;r.versions.push({v:r.version,at:new Date().toISOString(),by:ME.name,total:L.req,lines:JSON.parse(JSON.stringify(r.lines))});
 if(!r.ref){const d=new Date();r.ref=`GN-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-${Date.now().toString(36).slice(-4).toUpperCase()}`}
 c.status='Submitted by CVC';log('Submit for review',rc,r.ref);save();pushChild(rc);toast(t('Submitted. Reference: ','បានដាក់ស្នើ។ លេខយោង៖ ')+r.ref);back()}
/* ---- data in / out ---- */
function loadFile(f){if(!f)return;const rd=new FileReader();rd.onload=e=>{try{const o=JSON.parse(e.target.result);if(o.v!==1||!o.children)throw 0;
 const old=S;S=Object.assign(blank(),o);S.ui=Object.assign({},o.ui||{},{lang:old.ui.lang});S.mine=old.mine;S.audit=old.audit||[];
 for(const rc in old.req){const lo=old.children[rc],nw=S.children[rc];if(nw&&lo&&old.req[rc].lines.length&&['Draft Request','Submitted by CVC'].includes(lo.status)&&['Published to CVC','Draft Request'].includes(nw.status)){S.req[rc]=old.req[rc];nw.status=lo.status}}
 prune();
 S.imported=new Date().toLocaleString();save();toast(t('Data loaded','បានទាញទិន្នន័យ'));render()}catch(x){toast(t('Invalid file','ឯកសារមិនត្រឹមត្រូវ'))}};rd.readAsText(f)}
async function share(){const sub={};mine().forEach(c=>{if(STATUSES.indexOf(c.status)>=3&&c.status!=='Published to CVC')sub[c.rcId]={status:c.status,phone:c.phone||'',sponsor:c.sponsor||'',req:S.req[c.rcId]}});
 if(!Object.keys(sub).length)return toast(t('Nothing to send yet','មិនទាន់មានអ្វីត្រូវផ្ញើ'));
 const blob=new Blob([JSON.stringify({kind:'cvc-submission',v:1,by:ME.name,at:new Date().toISOString(),children:sub,audit:S.audit.slice(0,50)})],{type:'application/json'});
 const fn=`gn-cvc-${(ME.username||'cvc').replace(/\W/g,'')}-${new Date().toISOString().slice(0,10)}.json`,f=new File([blob],fn,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],title:'GN CVC'})}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
/* ---- LIVE sync with the dashboard database (rows 'gncvc:*' in shared_kv only) ---- */
function prune(){const keep=new Set(mine().map(c=>c.rcId));if(ME&&ME.role!=='admin'&&(DASH.idx||(S.mine&&S.mine.u===ME.username))){for(const k of ['children','req','hist'])for(const rc in S[k])if(!keep.has(rc))delete S[k][rc];for(const k in S.gn)if(!keep.has(S.gn[k].rc))delete S.gn[k]}}
async function lvPut(id,value){const sb=await dSb();const {error}=await sb.from('shared_kv').upsert({id,value,chunked:false});if(error)throw error}
async function pushChild(rc){const c=S.children[rc];if(!c||!ME)return;c.liveAt=new Date().toISOString();
 try{await lvPut('gncvc:sub:'+rc,JSON.stringify({rc,status:c.status,phone:c.phone||'',sponsor:c.sponsor||'',req:S.req[rc],at:c.liveAt,by:ME.name}));c.dirty=false;save();toast('☁ '+t('Synced','បានសមកាលកម្ម'))}
 catch(e){c.dirty=true;save();toast(t('Saved on phone – will sync when online','បានរក្សាទុក – នឹងសមកាលកម្មពេលមានអ៊ីនធឺណិត'))}}
function applyPub(o){const old=S;S=Object.assign(blank(),o);S.ui=Object.assign({},o.ui||{},{lang:old.ui.lang});S.mine=old.mine;S.audit=old.audit||[];
 for(const rc in old.req){const lo=old.children[rc],nw=S.children[rc];if(nw&&lo&&old.req[rc].lines.length&&(lo.liveAt||'')>(o.pubAt||'')&&['Draft Request','Submitted by CVC'].includes(lo.status)){S.req[rc]=old.req[rc];Object.assign(nw,{status:lo.status,liveAt:lo.liveAt,phone:lo.phone,sponsor:lo.sponsor,dirty:lo.dirty})}}
 prune();S.imported=new Date().toLocaleString()}
async function liveSync(q){if(!ME)return;try{for(const rc in S.children)if(S.children[rc].dirty)await pushChild(rc);const raw=await dGet('gncvc:pub:v1');
 if(!raw){if(!q)toast(t('Nothing published yet','មិនទាន់មានទិន្នន័យ'));return}applyPub(JSON.parse(raw));save();render();if(!q)toast('☁ '+t('Up to date','ទាន់សម័យ'))}
 catch(e){if(!q)toast(t('Sync failed: ','សមកាលកម្មបរាជ័យ៖ ')+(e.message||e))}}
function render(){$('#bl').textContent=S.ui.lang==='km'?'ខ្មែរ':S.ui.lang==='en'?'EN':'ខ/EN';if(!ME)return;$('#app').innerHTML=V.s==='home'?home():child();if(V.s==='child')upd()}
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 try{const s=JSON.parse(localStorage.getItem(SES)||'null');if(s&&Date.now()-s.at<12*36e5){try{await start(s.u)}catch(e){await start(s.u,true)}}}catch(e){}})();
