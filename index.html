<!doctype html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab"><meta name="apple-mobile-web-app-capable" content="yes">

<title>GN CVC</title>

<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#5b6b85;--pri:#0b5cab;--pri2:#084a8c;--line:#d9e2ef;--ok:#1b7f4b;--warn:#b26a00;--err:#b3261e;--okbg:#e6f4ec;--warnbg:#fff3df;--errbg:#fde8e6;--acc:#f28c00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Khmer','Inter',system-ui,sans-serif}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin:0;flex:1 1 260px}
header select,header input{padding:6px 8px;border-radius:6px;border:0;font:inherit;max-width:170px}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{max-width:1250px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
.stat.w b{color:var(--warn)}.stat.e b{color:var(--err)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef3fa;font-weight:600;position:sticky;top:0}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.num{text-align:right;font-variant-numeric:tabular-nums}
button.b,label.b{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
button.b:hover{background:var(--pri2)}button.b:disabled{opacity:.45;cursor:not-allowed}
button.b.s{background:#fff;color:var(--pri);border:1px solid var(--pri)}button.b.r{background:var(--err)}button.b.a{background:var(--acc)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
td input,td select{width:100%;min-width:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.row>div{display:flex;flex-direction:column;gap:3px}.row label{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#e3edf9;color:var(--pri2);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.err{background:var(--errbg);color:var(--err)}
.msg{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:14px}
.msg.warn{background:var(--warnbg);color:#6b4100}.msg.err{background:var(--errbg);color:var(--err)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.info{background:#e3edf9;color:var(--pri2)}
.bar{height:12px;background:#e3e9f3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar i.o{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(10,25,50,.55);display:none;z-index:20;overflow:auto;padding:12px}
.modal.on{display:block}.modal .in{background:#fff;max-width:1000px;margin:0 auto;border-radius:12px;padding:16px}
.split{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.split{grid-template-columns:1fr}main{padding:10px}}
small,.mut{color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:90vw}
@media print{header,nav,.noprint,button{display:none!important}.card{border:0}.tw{max-height:none;overflow:visible}}
body.locked header,body.locked nav,body.locked main{display:none}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
body.locked #login{display:flex}
#login .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;text-align:center}
#login .box input{width:100%;margin-bottom:10px}#login .err{color:var(--err);background:var(--errbg);border-radius:8px;padding:8px;margin-bottom:10px;display:none}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e3e9f3;margin-bottom:3px}.seg i{display:block;height:100%}.s-done{background:var(--ok)}.s-staff{background:var(--pri)}.s-cvc{background:var(--acc)}.s-cant{background:var(--err)}.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:middle}

body{padding-bottom:90px;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
header{position:sticky;top:0;z-index:6;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:nowrap}
header h1{font-size:16px;flex:1}header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;min-width:40px;height:38px;font:inherit}
main{max-width:640px}
.ch{cursor:pointer}.top{display:flex;justify-content:space-between;gap:8px}.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--mut)}.late{color:var(--err);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap;font:inherit;color:var(--mut)}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.step{display:flex}.step button{width:44px;border:1px solid var(--line);background:#eef3fa;font-size:22px;color:var(--pri);border-radius:8px 0 0 8px}.step button:last-child{border-radius:0 8px 8px 0}.step input{width:100%;min-width:0;text-align:center;border-radius:0}
.r3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;margin-top:8px}.r3 label{font-size:12px;color:var(--mut);display:block}.r3 input{width:100%}
.lh{display:flex;justify-content:space-between;gap:8px}.x{border:0;background:var(--errbg);color:var(--err);border-radius:8px;width:38px;height:38px;font-size:16px}
.stot{text-align:right;margin-top:8px;font-weight:700;color:var(--pri)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:8}.bottom .b{flex:1}
.sheet{position:fixed;inset:0;background:rgba(10,25,50,.55);z-index:20;display:flex;align-items:flex-end}.sheet>div{background:#fff;width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding:14px;overflow:auto}
.pi{display:flex;justify-content:space-between;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font:inherit;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bk{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bk>button{min-width:44px}
.ci{font-style:normal;font-size:34px;line-height:1;margin-bottom:4px}.ii{font-style:normal;font-size:24px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:#eef3fa;border-radius:10px;flex:none}.pn{display:flex;align-items:center;gap:10px}
.ii img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.catbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:96px;padding:12px;text-align:left;background:#eef3fa;border:1px solid var(--line);border-radius:12px;font:inherit;font-weight:600;color:var(--pri2)}.catbtn small{font-weight:400;color:var(--mut)}.cathead{display:flex;justify-content:space-between;margin:14px 2px 8px;padding:6px 10px;background:#e3edf9;border-radius:8px;font-weight:700;color:var(--pri2);font-size:14px}
.big{width:100%;margin:4px 0 12px}.empty{text-align:center;color:var(--mut);padding:26px 10px}
#bs.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<header><h1>🎁 GN CVC<br><small style="color:#cfe0f5" id="who"></small></h1><button id="bs" title="Refresh / ធ្វើបច្ចុប្បន្នភាព">⟳</button><button id="bl" title="Language">ខ្មែរ</button><button id="bo" title="Log out">⎋</button></header>
<main id="app"></main><div id="bar"></div><div id="toast"></div>
<div id="login" style="display:flex"><div class="box"><div style="font-size:36px">🔐</div><h2 style="margin:6px 0 2px">GN CVC · MBR2</h2><div class="mut" style="margin-bottom:14px">ចូលដោយគណនី Dashboard MBR2 · Log in with your MBR2 account</div><div class="err" id="lerr"></div><input id="luser" placeholder="ឈ្មោះអ្នកប្រើ · Username" autocomplete="username"><input id="lpin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="current-password"><button class="b" id="lgo" style="width:100%">ចូល · Log in</button><div class="mut" id="lstat" style="margin-top:10px;font-size:12px"></div></div></div>
<script>
const STATUSES=['Imported','Validated','Published to CVC','Draft Request','Submitted by CVC','Supervisor Review','Budget and Finance Review','Approved for Purchasing','Purchasing in Progress','Purchased','Distribution and Receipt Confirmation','Reconciliation','Closed'];
const STKH={'Imported':'បាននាំចូល','Validated':'បានផ្ទៀងផ្ទាត់','Published to CVC':'បានផ្សាយទៅ CVC','Draft Request':'សំណើព្រាង','Submitted by CVC':'CVC បានដាក់ស្នើ','Supervisor Review':'ត្រួតពិនិត្យដោយអ្នកគ្រប់គ្រង','Budget and Finance Review':'ត្រួតពិនិត្យថវិកា និងហិរញ្ញវត្ថុ','Approved for Purchasing':'អនុម័តឱ្យទិញ','Purchasing in Progress':'កំពុងទិញ','Purchased':'បានទិញរួច','Distribution and Receipt Confirmation':'ចែកចាយ និងបញ្ជាក់ការទទួល','Reconciliation':'ផ្ទៀងផ្ទាត់ចុងក្រោយ','Closed':'បិទបញ្ជី','Rejected':'បដិសេធ'};
const ROLES={admin:['System Administrator','អ្នកគ្រប់គ្រងប្រព័ន្ធ'],gnc:['GN Coordinator','អ្នកសម្របសម្រួល GN'],cvc:['CVC User','អ្នកសម្របសម្រួលស្ម័គ្រចិត្តសហគមន៍ (CVC)'],sup:['ADP / Programme Supervisor','អ្នកគ្រប់គ្រងកម្មវិធី'],fin:['Finance Reviewer','អ្នកត្រួតពិនិត្យហិរញ្ញវត្ថុ'],pur:['Purchasing Officer','មន្ត្រីទិញ'],fap:['Final Approver','អ្នកអនុម័តចុងក្រោយ'],aud:['Auditor / Read-only','សវនករ / មើលតែប៉ុណ្ណោះ']};

const t=(en,km)=>S.ui.lang==='en'?en:S.ui.lang==='km'?km:km+' / '+en;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd2=n=>n==null||isNaN(n)?'—':'$'+Number(n).toFixed(2);
const usd=n=>n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const khr=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:0})+' ៛';
const catName=id=>(S.cats.find(c=>c.id===id)||{name:id}).name;
/* ---- icons: matched from Khmer/English words in the category or item name ---- */
const ICONS=[
['🎒','កាបូប|bag|backpack|satchel'],
['👟','ស្បែកជើង|shoe|sandal|slipper|boot'],
['👕','ឯកសណ្ឋាន|សម្លៀកបំពាក់|ខោ|អាវ|ក្រមា|uniform|cloth|shirt|dress|garment|apparel'],
['🚲','កង់|bicycle|bike|cycle'],
['☔','ឆ័ត្រ|អាវភ្លៀង|umbrella|raincoat'],
['📚','សៀវភៅ|សិក្សា|ការសិក្សា|ប៊ិច|ខ្មៅដៃ|ថ្នាំងលុប|school|study|education|book|pen|pencil|notebook|stationery|learning'],
['💻','កុំព្យូទ័រ|ថេប្លេត|ទូរស័ព្ទ|computer|laptop|tablet|phone|electronic'],
['🍚','អង្ករ|អាហារ|ម្ហូប|មី|ត្រី|ស្ករ|ប្រេង|food|rice|noodle|nutrition|grocery|meal'],
['🧼','អនាម័យ|សាប៊ូ|ថ្នាំដុសធ្មេញ|ដុសធ្មេញ|hygiene|soap|toothbrush|toothpaste|sanitary|shampoo'],
['💊','សុខភាព|ថ្នាំ|ពេទ្យ|វេជ្ជសាស្ត្រ|health|medical|medicine|hospital|treatment'],
['🛏️','មុង|ភួយ|កន្ទេល|ពូក|គ្រែ|ក្រណាត់|bed|mosquito|net|blanket|mat|pillow|bedding'],
['🍳','ចង្ក្រាន|ឆ្នាំង|ចាន|ស្លាបព្រា|កាំបិត|ឡ|kitchen|cook|pot|pan|plate|stove|utensil'],
['💧','ទឹក|ស្អាត|តម្រងទឹក|ឯកសារទឹក|water|filter|well|toilet|latrine|sanitation|wash'],
['🐔','មាន់|ទា|ជ្រូក|គោ|ក្របី|ចិញ្ចឹម|សត្វ|chicken|duck|pig|cow|animal|livestock|poultry'],
['🌱','កសិកម្ម|ដំណាំ|ពូជ|ជី|ស្រែ|ចម្ការ|ដាំ|farm|agri|seed|crop|plant|garden|fertili[sz]er'],
['🏠','ផ្ទះ|ជួសជុល|ស័ង្កសី|ដំបូល|house|home|shelter|repair|roof|housing'],
['💡','ភ្លើង|ថ្មពន្លឺ|ពិល|solar|light|lamp|electric|battery|torch'],
['🔧','ឧបករណ៍|ជំនាញ|ជួសជុល|សិប្បកម្ម|ដេរ|ម៉ាស៊ីន|tool|vocation|skill|business|machine|sewing|equipment|livelihood'],
['🧸','ប្រដាប់ក្មេងលេង|ក្មេងលេង|ល្បែង|toy|game|play'],
['⚽','កីឡា|បាល់|sport|ball|football'],
['🎁','កាដូ|អំណោយ|ពិសេស|gift|special|birthday|christmas'],
['💵','សាច់ប្រាក់|ប្រាក់|ថ្លៃ|cash|money|fee|tuition|transport|cost'],
['🚌','ធ្វើដំណើរ|ដឹកជញ្ជូន|ឡាន|ម៉ូតូ|bus|travel|vehicle|motor']];
const ICRE=ICONS.map(x=>[x[0],new RegExp(x[1],'i')]);
const icoOf=txt=>{const v=String(txt||'');for(const [e,r] of ICRE)if(r.test(v))return e;return ''};
const catIco=id=>icoOf(catName(id))||'📦';

 const {data,error}=await sb.from('shared_kv').select('*').eq('id',id).maybeSingle();if(error)throw error;if(!data)return null;if(!data.chunked)return data.value;

 return `<div class="sheet" onclick="if(event.target===this){V.pick=false;render()}"><div><div class="top" style="margin-bottom:8px;align-items:center"><div style="display:flex;align-items:center;gap:8px">${inCat?`<button class="b s" style="min-height:36px;padding:4px 12px" onclick="V.pc='';V.pq='';render()">←</button>`:''}<h3 style="margin:0">${inCat?catIco(V.pc)+' '+esc(catName(V.pc)):t('Choose category','ជ្រើសប្រភេទ')}</h3></div><button class="b s" style="min-height:36px;padding:4px 12px" onclick="V.pick=false;render()">✕</button></div>
 <input id="pq" placeholder="🔍 ${inCat?t('Search item','ស្វែងរកសម្ភារៈ'):t('Search all items','ស្វែងរកសម្ភារៈទាំងអស់')}" value="${esc(V.pq)}" style="width:100%;margin-bottom:8px"><div id="plist">${plist()}</div>
 <div class="row" style="margin-top:12px"><div style="flex:1"><label>${t('Other item (type name)','សម្ភារៈផ្សេង (វាយឈ្មោះ)')}</label><input id="oth" style="width:100%"></div><button class="b" onclick="pickOther()">＋</button></div></div></div>`}
function addL(o){getReq(V.rc).lines.push(Object.assign({cat:V.pc,name:'',spec:'',qty:1,unit:'',price:'',supplier:'',remark:''},o));V.pick=false;mark();save();render();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50)}
function pickItem(i){const it=S.items[i];addL({cat:it.cat,name:it.name,unit:it.unit||'',price:it.price||'',supplier:it.supplier||''})}
function pickOther(){const v=$('#oth').value.trim();if(!v)return toast(t('Type a name','សូមវាយឈ្មោះ'));addL({cat:V.pc||(S.cats[0]&&S.cats[0].id)||'',name:v})}
/* ---- actions (same rules as the dashboard: cannot submit over budget / zero qty / missing price / repeat item) ---- */
function draft(){const c=S.children[V.rc];c.status='Draft Request';log('Save draft',V.rc);save();pushChild(V.rc);toast(t('Saved','បានរក្សាទុក'));back()}
function submit(){const rc=V.rc,c=S.children[rc],r=getReq(rc),L=ledger(rc);
 if(!r.lines.length)return toast(t('Add at least one item','សូមបន្ថែមសម្ភារៈយ៉ាងតិចមួយ'));
 if(L.warns.some(w=>/zero|missing price|no item|already in memo/.test(w)))return toast(t('Fix zero quantities / missing prices first','សូមកែចំនួនសូន្យ ឬតម្លៃដែលបាត់'));
 if(L.over)return toast(t('Over budget – reduce items first','លើសថវិកា – សូមកាត់បន្ថយសម្ភារៈ'));
 if(!confirm(t('Submit this request for review?','ដាក់ស្នើសំណើនេះ?')))return;
 r.version++;r.versions.push({v:r.version,at:new Date().toISOString(),by:ME.name,total:L.req,lines:JSON.parse(JSON.stringify(r.lines))});
 if(!r.ref){const d=new Date();r.ref=`GN-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-${Date.now().toString(36).slice(-4).toUpperCase()}`}
 c.status='Submitted by CVC';log('Submit for review',rc,r.ref);save();pushChild(rc);toast(t('Submitted. Reference: ','បានដាក់ស្នើ។ លេខយោង៖ ')+r.ref);back()}
/* ---- data in / out ---- */
function loadFile(f){if(!f)return;const rd=new FileReader();rd.onload=e=>{try{const o=JSON.parse(e.target.result);if(o.v!==1||!o.children)throw 0;
 const old=S;S=Object.assign(blank(),o);S.ui=Object.assign({},o.ui||{},{lang:old.ui.lang});S.mine=old.mine;S.audit=old.audit||[];
 for(const rc in old.req){const lo=old.children[rc],nw=S.children[rc];if(nw&&lo&&old.req[rc].lines.length&&['Draft Request','Submitted by CVC'].includes(lo.status)&&['Published to CVC','Draft Request'].includes(nw.status)){S.req[rc]=old.req[rc];nw.status=lo.status}}
 prune();
 S.imported=new Date().toLocaleString();save();toast(t('Data loaded','បានទាញទិន្នន័យ'));render()}catch(x){toast(t('Invalid file','ឯកសារមិនត្រឹមត្រូវ'))}};rd.readAsText(f)}
async function share(){const sub={};mine().forEach(c=>{if(STATUSES.indexOf(c.status)>=3&&c.status!=='Published to CVC')sub[c.rcId]={status:c.status,phone:c.phone||'',sponsor:c.sponsor||'',req:S.req[c.rcId]}});
 if(!Object.keys(sub).length)return toast(t('Nothing to send yet','មិនទាន់មានអ្វីត្រូវផ្ញើ'));
 const blob=new Blob([JSON.stringify({kind:'cvc-submission',v:1,by:ME.name,at:new Date().toISOString(),children:sub,audit:S.audit.slice(0,50)})],{type:'application/json'});
 const fn=`gn-cvc-${(ME.username||'cvc').replace(/\W/g,'')}-${new Date().toISOString().slice(0,10)}.json`,f=new File([blob],fn,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],title:'GN CVC'})}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
/* ---- LIVE sync with the dashboard database (rows 'gncvc:*' in shared_kv only) ---- */
function prune(){const keep=new Set(mine().map(c=>c.rcId));if(ME&&ME.role!=='admin'&&(DASH.idx||(S.mine&&S.mine.u===ME.username))){for(const k of ['children','req','hist'])for(const rc in S[k])if(!keep.has(rc))delete S[k][rc];for(const k in S.gn)if(!keep.has(S.gn[k].rc))delete S.gn[k]}}
async function lvPut(id,value){const sb=await dSb();const {error}=await sb.from('shared_kv').upsert({id,value,chunked:false});if(error)throw error}
async function pushChild(rc){const c=S.children[rc];if(!c||!ME)return;c.liveAt=new Date().toISOString();
 try{await lvPut('gncvc:sub:'+rc,JSON.stringify({rc,status:c.status,phone:c.phone||'',sponsor:c.sponsor||'',req:S.req[rc],at:c.liveAt,by:ME.name}));await lvPut('gncvc:subs:meta',JSON.stringify({at:c.liveAt,rc,by:ME.name}));c.dirty=false;c.edited=false;save();toast('☁ '+t('Synced','បានសមកាលកម្ម'))}
 catch(e){c.dirty=true;save();toast(t('Saved on phone – will sync when online','បានរក្សាទុក – នឹងសមកាលកម្មពេលមានអ៊ីនធឺណិត'))}}
function applyPub(o){const old=S;S=Object.assign(blank(),o);S.ui=Object.assign({},o.ui||{},{lang:old.ui.lang});S.mine=old.mine;S.audit=old.audit||[];
 for(const rc in old.req){const lo=old.children[rc],nw=S.children[rc];if(!nw||!lo||!old.req[rc].lines.length)continue;
  const newer=(lo.liveAt||'')>(o.pubAt||'')&&['Draft Request','Submitted by CVC'].includes(lo.status);
  const mid=lo.edited&&['Published to CVC','Draft Request'].includes(lo.status)&&['Published to CVC','Draft Request'].includes(nw.status);   /* unsaved typing is never overwritten */
  if(newer||mid){S.req[rc]=old.req[rc];Object.assign(nw,{status:lo.status,liveAt:lo.liveAt,phone:lo.phone,sponsor:lo.sponsor,dirty:lo.dirty,edited:lo.edited})}}
 prune();S.imported=new Date().toLocaleString()}
/* ================= AUTO-SYNC =================
   The phone checks a tiny "meta" row every 30 s, when the app is opened / brought back to the screen, and when the network returns.
   Only when the system has published something new does it download the data (and re-read the dashboard roster so new RC are matched to this CVC).
   The big snapshot is immutable (own key per publish), so it can never be read half-written. */
const SYN={busy:false,at:null,err:'',rosterAt:0,full:0,defer:false};
const mark=()=>{const c=S.children[V.rc];if(c)c.edited=true};
const busyTyping=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const hhmm=d=>d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
const rsig=()=>DASH.idx?DASH.n+'|'+JSON.stringify(DASH.cvcMap||{}).length:'';
function synText(){if(SYN.busy)return '⟳ '+t('Syncing…','កំពុងធ្វើសមកាលកម្ម…');
  if(SYN.err)return '⚠ '+t('Not updated: ','មិនទាន់ទាន់សម័យ៖ ')+esc(SYN.err);
  if(!SYN.at)return '';
  const p=S.pubAt?' · '+t('published ','ផ្សាយ ')+new Date(S.pubAt).toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return '☁ '+t('Up to date ','ទាន់សម័យ ')+hhmm(SYN.at)+p+' · '+Object.keys(S.children).length+' RC'}
function synPaint(){const e=$('#synst');if(e)e.innerHTML=synText();const b=$('#bs');if(b)b.classList.toggle('spin',SYN.busy)}
async function dRefresh(){const o={idx:DASH.idx,rc:DASH.rc,cvcMap:DASH.cvcMap,n:DASH.n};const ok=await dLoad();
  if(!ok&&o.idx){DASH.idx=o.idx;DASH.rc=o.rc;DASH.cvcMap=o.cvcMap;DASH.n=o.n;DASH.err=''}SYN.rosterAt=Date.now();return ok}
/* q=true: quiet background check.  force=true: refresh button – re-reads roster + full snapshot no matter what */
async function liveSync(q,force){if(!ME||SYN.busy)return;SYN.busy=true;SYN.err='';synPaint();
  try{for(const rc in S.children)if(S.children[rc].dirty)await pushChild(rc);
    let meta=null;try{const m=await dGet('gncvc:pub:meta');meta=m?JSON.parse(m):null}catch(e){}
    const before=rsig();
    if(force||!DASH.idx||Date.now()-SYN.rosterAt>300000)await dRefresh();
    const need=force||!S.pubAt||rsig()!==before||(meta?meta.pubAt!==S.pubAt:Date.now()-SYN.full>120000);
    if(need){const raw=await dGet(meta&&meta.key?meta.key:'gncvc:pub:v1');SYN.full=Date.now();
      if(!raw)SYN.err=t('Nothing published yet','មិនទាន់មានទិន្នន័យផ្សាយ');
      else{applyPub(JSON.parse(raw));save();if(busyTyping())SYN.defer=true;else render()}}
    if(!SYN.err)SYN.at=new Date();
    if(!q&&!SYN.err)toast('☁ '+t('Up to date','ទាន់សម័យ'))}
  catch(e){SYN.err=e.message||String(e);if(!q)toast(t('Sync failed: ','សមកាលកម្មបរាជ័យ៖ ')+SYN.err)}
  SYN.busy=false;synPaint()}
async function hardRefresh(){try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}location.reload()}
setInterval(()=>{if(ME&&!document.hidden)liveSync(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)liveSync(true)});
window.addEventListener('online',()=>{if(ME)liveSync(true)});
window.addEventListener('focus',()=>{if(ME)liveSync(true)});
document.addEventListener('focusout',()=>{if(SYN.defer)setTimeout(()=>{if(!busyTyping()){SYN.defer=false;keep()}},300)});
function render(){$('#bl').textContent=S.ui.lang==='km'?'ខ្មែរ':S.ui.lang==='en'?'EN':'ខ/EN';if(!ME)return;if(V.s==='child'&&!S.children[V.rc]){V.s='home';V.pick=false}$('#app').innerHTML=V.s==='home'?home():child();if(V.s==='child')upd();synPaint()}
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{});
 try{const s=JSON.parse(localStorage.getItem(SES)||'null');if(s&&Date.now()-s.at<12*36e5){try{await start(s.u)}catch(e){await start(s.u,true)}}}catch(e){}})();
</script></body></html>
